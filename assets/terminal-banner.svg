<svg xmlns="http://www.w3.org/2000/svg" width="850" height="142" viewBox="0 0 850 142" role="img" aria-labelledby="title desc">
  <title id="title">ash · demetae</title>
  <desc id="desc">A dark terminal window showing demetae running whoami, with ash as the output and a blinking cursor.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .cursor { animation: blink 1.2s step-end infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
  <rect x="0.5" y="0.5" width="849" height="141" rx="10" fill="#0d1117" stroke="#30363d"/>
  <path d="M11 1H839Q849 1 849 11V34H1V11Q1 1 11 1Z" fill="#161b22"/>
  <path d="M1 34H849" stroke="#30363d"/>
  <circle cx="20" cy="18" r="4" fill="#f87171"/>
  <circle cx="36" cy="18" r="4" fill="#fbbf24"/>
  <circle cx="52" cy="18" r="4" fill="#34d399"/>
  <text x="425" y="22" text-anchor="middle" fill="#8b949e" font-size="11">demetae — ~</text>
  <text x="24" y="64" font-size="16"><tspan fill="#34d399">demetae</tspan><tspan fill="#8b949e">:~ $ </tspan><tspan fill="#e6edf3">whoami</tspan></text>
  <text x="24" y="92" fill="#e6edf3" font-size="18" font-weight="600">ash</text>
  <text x="24" y="121" fill="#34d399" font-size="16">$</text>
  <rect class="cursor" x="44" y="108" width="9" height="16" rx="1" fill="#34d399"/>
</svg>
